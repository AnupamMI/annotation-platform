# Database migrations. The database URL comes from app settings (DATABASE_URL / .env), not from here.
#   alembic upgrade head                          bring a database up to date (the API also does this on start)
#   alembic revision --autogenerate -m "what"     after changing models: write a new migration, then read it
#   alembic check                                 fails if the models and the migrations disagree (run in CI)

[alembic]
script_location = %(here)s/migrations
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
